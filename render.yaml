services:
  - type: web
    name: bengal-election
    runtime: node
    region: singapore
    plan: free
    buildCommand: >-
      apt-get install -y
      libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2
      libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2
      libgbm1 libpangocairo-1.0-0 libpango-1.0-0 libcairo2
      libatspi2.0-0 libgtk-3-0
      libasound2t64 2>/dev/null ||
      apt-get install -y
      libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2
      libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2
      libgbm1 libpangocairo-1.0-0 libpango-1.0-0 libcairo2
      libatspi2.0-0 libgtk-3-0
      libasound2 2>/dev/null || true ;
      npm install &&
      PUPPETEER_CACHE_DIR=/opt/render/project/src/.puppeteer-cache
      npx puppeteer browsers install chrome
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: ECI_RESULTS_URL
        value: https://results.eci.gov.in/ResultAcGenMay2026/partywiseresult-S25.htm
      - key: SCRAPE_INTERVAL_MS
        value: "90000"
      - key: PUPPETEER_CACHE_DIR
        value: /opt/render/project/src/.puppeteer-cache
